{{- if .Values.fleet.autoApplySQLMigrations }}
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app: fleet
    chart: fleet
    heritage: {{ .Release.Service }}
    release: {{ .Release.Name }}
  name: fleet-migration
  namespace: {{ .Release.Namespace }}
  {{- with .Values.fleet.migrationJobAnnotations }}
  annotations:
    {{- toYaml . | trim | nindent 4 }}
  {{- end }}

spec:
  template:
    metadata:
{{- with .Values.podAnnotations }}
      annotations:
{{- toYaml . | trim | nindent 8 }}
{{- end }}
      labels:
        app: fleet
        chart: fleet
        heritage: {{ .Release.Service }}
        release: {{ .Release.Name }}

    spec:
      restartPolicy: Never
      # >>> OPENFRAME(hardening): pod-level non-root context — openframe/docs/helm-chart.md
      {{- with .Values.fleet.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # <<< OPENFRAME(hardening)

      # >>> OPENFRAME(helm): fork-added init container blocking migration until MySQL is reachable — openframe/docs/helm-chart.md
      {{- if and .Values.fleet.waitForMysql.enabled (not .Values.gke.cloudSQL.enableProxy) }}
      initContainers:
      - name: wait-for-mysql
        image: {{ .Values.fleet.waitForMysql.image | quote }}
        {{- with .Values.fleet.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        command: ['sh', '-c', 'until nc -z -w 2 "$HOST" "$PORT"; do sleep 5; done']
        env:
          - name: HOST
            valueFrom:
              configMapKeyRef:
                name: {{ default "fleet-database" .Values.database.existingConfigMap }}
                key: {{ .Values.database.hostKey }}
          - name: PORT
            valueFrom:
              configMapKeyRef:
                name: {{ default "fleet-database" .Values.database.existingConfigMap }}
                key: {{ .Values.database.portKey }}
      {{- end }}
      # <<< OPENFRAME(helm)

      containers:
      - name: fleet-migration
        command: ["/bin/sh", "-c"]
        args:
          - |
            /usr/bin/fleet prepare db --no-prompt;
            {{- if .Values.gke.cloudSQL.enableProxy }}
            rc=$?;
            timeout 10 sh -c 'until wget -q -Y off -T 2 -O- http://127.0.0.1:9091/quitquitquit; do sleep 1; done' || true;
            exit $rc;
            {{- end }}
        image: "{{ .Values.imageRepository }}:{{ .Values.imageTag }}"
        {{- with .Values.imagePullPolicy }}
        imagePullPolicy: {{ . }}
        {{- end }}
        resources:
          limits:
            cpu: {{ .Values.resources.limits.cpu }}
            memory: {{ .Values.resources.limits.memory }}
          requests:
            cpu: {{ .Values.resources.requests.cpu }}
            memory: {{ .Values.resources.requests.memory }}
        env:
          - name: FLEET_SERVER_ADDRESS
            value: "0.0.0.0:{{ .Values.fleet.listenPort }}"
          - name: FLEET_AUTH_BCRYPT_COST
            value: "{{ .Values.fleet.auth.bcryptCost }}"
          - name: FLEET_AUTH_SALT_KEY_SIZE
            value: "{{ .Values.fleet.auth.saltKeySize }}"
          - name: FLEET_APP_TOKEN_KEY_SIZE
            value: "{{ .Values.fleet.app.tokenKeySize }}"
          - name: FLEET_APP_TOKEN_VALIDITY_PERIOD
            value: "{{ .Values.fleet.app.inviteTokenValidityPeriod }}"
          - name: FLEET_SESSION_KEY_SIZE
            value: "{{ .Values.fleet.session.keySize }}"
          - name: FLEET_SESSION_DURATION
            value: "{{ .Values.fleet.session.duration }}"
          - name: FLEET_LOGGING_DEBUG
            value: "{{ .Values.fleet.logging.debug }}"
          - name: FLEET_LOGGING_JSON
            value: "{{ .Values.fleet.logging.json }}"
          - name: FLEET_LOGGING_DISABLE_BANNER
            value: "{{ .Values.fleet.logging.disableBanner }}"
          - name: FLEET_SERVER_TLS
            value: "{{ .Values.fleet.tls.enabled }}"
          {{- if .Values.fleet.tls.enabled }}
          - name: FLEET_SERVER_TLS_COMPATIBILITY
            value: "{{ .Values.fleet.tls.compatibility }}"
          - name: FLEET_SERVER_CERT
            value: "/secrets/tls/{{ .Values.fleet.tls.certSecretKey }}"
          - name: FLEET_SERVER_KEY
            value: "/secrets/tls/{{ .Values.fleet.tls.keySecretKey }}"
          {{- end }}
          # >>> OPENFRAME(mysql-multitenancy): with multitenancy on, `fleet prepare db`
          # serializes concurrent migration runs against the shared MySQL via a named lock
          # (GET_LOCK) — the flag must reach the migration Job, not only the server.
          - name: FLEET_OPENFRAME_MULTI_TENANCY_ENABLED
            value: {{ .Values.fleet.openframe.multiTenancy.enabled | quote }}
          # <<< OPENFRAME(mysql-multitenancy)
          ## END FLEET SECTION
          ## BEGIN MYSQL SECTION
          - name: FLEET_MYSQL_HOST
            valueFrom:
              configMapKeyRef:
                name: {{ default "fleet-database" .Values.database.existingConfigMap }}
                key: {{ .Values.database.hostKey }}
          - name: FLEET_MYSQL_PORT
            valueFrom:
              configMapKeyRef:
                name: {{ default "fleet-database" .Values.database.existingConfigMap }}
                key: {{ .Values.database.portKey }}
          - name: FLEET_MYSQL_ADDRESS
            value: "$(FLEET_MYSQL_HOST):$(FLEET_MYSQL_PORT)"
          - name: FLEET_MYSQL_DATABASE
            valueFrom:
              configMapKeyRef:
                name: {{ default "fleet-database" .Values.database.existingConfigMap }}
                key: {{ .Values.database.databaseKey }}
          - name: FLEET_MYSQL_USERNAME
            valueFrom:
              configMapKeyRef:
                name: {{ default "fleet-database" .Values.database.existingConfigMap }}
                key: {{ .Values.database.usernameKey }}
          - name: FLEET_MYSQL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ default "fleet-database" .Values.database.existingSecret }}
                key: {{ .Values.database.passwordKey }}
          - name: FLEET_MYSQL_MAX_OPEN_CONNS
            value: "{{ .Values.database.maxOpenConns }}"
          - name: FLEET_MYSQL_MAX_IDLE_CONNS
            value: "{{ .Values.database.maxIdleConns }}"
          - name: FLEET_MYSQL_CONN_MAX_LIFETIME
            value: "{{ .Values.database.connMaxLifetime }}"
          {{- if .Values.database.tls.enabled }}
          {{- if .Values.database.tls.caCertKey }}
          - name: FLEET_MYSQL_TLS_CA
            value: "/secrets/mysql/{{ .Values.database.tls.caCertKey }}"
          {{- end }}
          {{- if .Values.database.tls.certKey }}
          - name: FLEET_MYSQL_TLS_CERT
            value: "/secrets/mysql/{{ .Values.database.tls.certKey }}"
          {{- end }}
          {{- if .Values.database.tls.keyKey }}
          - name: FLEET_MYSQL_TLS_KEY
            value: "/secrets/mysql/{{ .Values.database.tls.keyKey }}"
          {{- end }}
          - name: FLEET_MYSQL_TLS_CONFIG
            value: "{{ .Values.database.tls.config }}"
          - name: FLEET_MYSQL_TLS_SERVER_NAME
            value: "{{ .Values.database.tls.serverName }}"
          {{- end }}
          ## END MYSQL SECTION
        # >>> OPENFRAME(hardening): non-root, read-only rootfs — openframe/docs/helm-chart.md
        {{- with .Values.fleet.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        # <<< OPENFRAME(hardening)
        volumeMounts:
          # >>> OPENFRAME(hardening): writable /tmp under the read-only rootfs — openframe/docs/helm-chart.md
          - name: tmp
            mountPath: /tmp
          # <<< OPENFRAME(hardening)
          {{- if .Values.database.tls.enabled }}
          - name: mysql-tls
            readOnly: true
            mountPath: /secrets/mysql
          {{- end }}
      {{- if .Values.gke.cloudSQL.enableProxy }}
      - name: cloudsql-proxy
        image: "{{ .Values.gke.cloudSQL.imageRepository }}:{{ .Values.gke.cloudSQL.imageTag }}"
        # >>> OPENFRAME(cloudsql-v2): v2 CLI + quitquitquit so the migration container can stop the sidecar — openframe/docs/helm-chart.md
        args:
        - "--port=3306"
        - "--structured-logs"
        - "--quitquitquit"
        {{- if not .Values.gke.cloudSQL.verbose }}
        - "--quiet"
        {{- end }}
        - "{{ required "gke.cloudSQL.instanceName is required when gke.cloudSQL.enableProxy is true" .Values.gke.cloudSQL.instanceName }}"
        # <<< OPENFRAME(cloudsql-v2)
        resources:
          limits:
            cpu: 0.5 # 500Mhz
            memory: 150Mi
          requests:
            cpu: 0.1 # 100Mhz
            memory: 50Mi
        # >>> OPENFRAME(hardening): proxy runs nonroot with a read-only rootfs — openframe/docs/helm-chart.md
        {{- with .Values.gke.cloudSQL.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        # <<< OPENFRAME(hardening)
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8}}
      {{- end }}
      serviceAccountName: fleet
      volumes:
        # >>> OPENFRAME(hardening): writable /tmp under the read-only rootfs — openframe/docs/helm-chart.md
        - name: tmp
          emptyDir:
        # <<< OPENFRAME(hardening)
        {{- if .Values.database.tls.enabled }}
        - name: mysql-tls
          secret:
            # >>> OPENFRAME(helm): the server CA rides in the same externally managed Secret as
            secretName: "{{ default .Values.database.secretName .Values.database.existingSecret }}"
            # <<< OPENFRAME(helm)
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
{{- end }}
