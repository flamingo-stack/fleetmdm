{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: fleet-database
  # >>> OPENFRAME(helm): annotations so the migration Job's Secret can join an Argo PreSync phase — openframe/docs/helm-chart.md
  {{- with .Values.database.secretAnnotations }}
  annotations:
    {{- toYaml . | trim | nindent 4 }}
  {{- end }}
  # <<< OPENFRAME(helm)
  labels:
    {{- include "fleet.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.passwordKey }}: {{ .Values.database.password | quote }}
{{- end }}
---
{{- if not .Values.fleet.setup.adminPassword.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: fleet-setup
  labels:
    {{- include "fleet.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.fleet.setup.adminPassword.secretKeyKey }}: {{ .Values.fleet.setup.adminPassword.secretKeyValue | quote }}
{{- end }}
