apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app: fleet
    chart: fleet
    heritage: {{ .Release.Service }}
    release: {{ .Release.Name }}
  name: fleet
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups:
  - core
  resources:
  - secrets
  resourceNames:
  # >>> OPENFRAME(helm): mirror the mysql-tls volume source — openframe/docs/helm-chart.md
  - {{ default .Values.database.secretName .Values.database.existingSecret }}
  # <<< OPENFRAME(helm)
  - {{ .Values.cache.secretName }}
  - {{ .Values.fleet.secretName }}
  - {{ .Values.osquery.secretName }}
  {{- range .Values.imagePullSecrets }}
  - {{ .name }}
  {{- end }}
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app: fleet
    chart: fleet
    heritage: {{ .Release.Service }}
    release: {{ .Release.Name }}
  name: fleet
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleet
subjects:
- apiGroup: ""
  kind: ServiceAccount
  name: fleet
  namespace: {{ .Release.Namespace }}
