apiVersion: v1
kind: ServiceAccount
metadata:
  {{- if or .Values.serviceAccountAnnotations .Values.gke.workloadIdentityEmail }}
  annotations:
  {{- with .Values.serviceAccountAnnotations}}
  {{- toYaml . | trim | nindent 4 }}
  {{- end }}
  {{- if ne .Values.gke.workloadIdentityEmail "" }}
    iam.gke.io/gcp-service-account: {{ .Values.gke.workloadIdentityEmail }}
  {{- end }}
{{- end }}
  labels:
    app: fleet
    chart: fleet
    heritage: {{ .Release.Service }}
    release: {{ .Release.Name }}
  # >>> OPENFRAME(helm): serviceAccount.name (openframe/docs/helm-chart.md)
  name: {{ include "fleet.serviceAccountName" . }}
  # <<< OPENFRAME(helm)
  namespace: {{ .Release.Namespace }}
